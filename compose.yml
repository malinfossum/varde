# Local stack: the API from this repo plus its own PostgreSQL.
# Start:  podman compose up -d --build
# Verify: curl --fail http://localhost:8080/health
name: varde

services:
  db:
    image: docker.io/library/postgres:16
    container_name: varde-db
    restart: unless-stopped
    cpus: 0.50
    mem_limit: 512m
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No ports: the database is reachable only from inside the compose network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: varde-api
    restart: unless-stopped
    cpus: 0.50
    mem_limit: 512m
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080
      APP_VERSION: dev
      MIGRATE_ON_STARTUP: "true"
      # Host=db is the service name on the compose network, not localhost
      ConnectionStrings__VardeDb: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      # The web frontend in dev; the API only answers GET and sends no credentials
      Cors__AllowedOrigins__0: "http://localhost:5173"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # A plain GET: --spider sends HEAD, and /health is mapped for GET only (405)
      test: ["CMD-SHELL", "wget --quiet --tries=1 --output-document=/dev/null http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
