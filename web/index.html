<!doctype html>
<html lang="nb">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			name="description"
			content="Varde – finn riktig hjelpetjeneste der du bor. Offentlig katalog over sosiale tjenester i Norge."
		/>
		<meta name="referrer" content="no-referrer" />
		<title>Varde</title>
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />

		<!-- No-flash theme init: must load BEFORE stylesheets, synchronously (no defer/module).
		     External file instead of inline so the CSP can stay script-src 'self' with no hashes. -->
		<script src="/theme-init.js"></script>

		<!-- All CSS (design-system + Tailwind + project styles) enters through src/styles/main.css,
		     imported by src/main.tsx, so the design-system can sit in a cascade layer. -->
	</head>
	<body>
		<!-- React renders everything inside #root (see src/main.tsx). The real, localized
		     skip link is rendered by the app shell (src/App.tsx) — no static duplicate here. -->
		<div id="root"></div>

		<!-- Vite entry point -->
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
