# Prod-sim: no build. The API image comes from CI (GHCR), the same bytes the pipeline tested.
#
# Deploy = set IMAGE_TAG in .env to a tag from a green pipeline, then:
#   podman compose -f compose.prod.yml pull
#   podman compose -f compose.prod.yml up -d
#   curl --fail http://localhost:8080/health    # version must equal IMAGE_TAG
#
# The package is public on GitHub, so pull needs no login. A private package needs
# `podman login ghcr.io` with a PAT first.
#
# API_IMAGE (name without tag) and IMAGE_TAG (the tag) come from .env. Changing IMAGE_TAG is
# the whole deploy: pull fetches, up swaps. Rollback is the same flow with the old tag.
name: varde-prod

services:
  db:
    image: docker.io/library/postgres:16
    container_name: varde-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - varde_prod_data:/var/lib/postgresql/data
    # No ports: the database is reachable only from inside the compose network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  api:
    # No build: the image is pulled from GHCR. That is the whole point.
    image: ${API_IMAGE}:${IMAGE_TAG:-latest}
    container_name: varde-api-prod
    restart: unless-stopped
    cpus: 0.50
    mem_limit: 512m
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080
      # The same value names the image and /health's version, so the two checks cannot disagree
      APP_VERSION: ${IMAGE_TAG:-latest}
      # MIGRATE_ON_STARTUP stays on in prod-sim, and I say so openly. In a real production
      # setup the app must NOT migrate itself: migrations run as their own pipeline step
      # (one runner, one lock, no race). Here there is one instance and one course volume,
      # so auto-migration is safe and keeps the deploy down to two commands.
      # More replicas means migration as a separate job with its own database rights.
      MIGRATE_ON_STARTUP: "true"
      # Host=db is the service name on the compose network, not localhost
      ConnectionStrings__VardeDb: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
    ports:
      - "8080:8080"
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: Kestrel binds IPv4 only. A plain GET: --spider sends HEAD,
      # and /health is mapped for GET only (405).
      test: ["CMD-SHELL", "wget --quiet --tries=1 --output-document=/dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  varde_prod_data:

networks:
  app-network:
    driver: bridge
