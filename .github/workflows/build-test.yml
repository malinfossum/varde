name: Bygg og test (kurs)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    name: Bygg og test
    runs-on: ubuntu-latest
    steps:
      - name: Sjekk ut koden
        uses: actions/checkout@v4
      - name: Installer .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Gjenopprett avhengigheter
        run: dotnet restore
      - name: Bygg
        run: dotnet build --no-restore
      - name: Test
        run: dotnet test --no-build
