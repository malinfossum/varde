name: CI

on:
  pull_request:

permissions:
  contents: read

# Telemetry off for every tool the runner starts.
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  # Job keys are the required-check contexts in the protect-main ruleset — do not rename.
  api-tests:
    runs-on: ubuntu-latest
    env:
      # This job has a Postgres service, so a missing server fails the tests instead of skipping them.
      VARDE_TEST_REQUIRE_DB: "1"
    services:
      # Matches TestDatabase.cs's default connection string, so no VARDE_TEST_PG is needed.
      # Throwaway credentials for a job-local container; they secure nothing.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Test
        run: dotnet test api/Varde.slnx


  # Real-browser layout checks against a full prerendered build. The data snapshot is real
  # seed data (web/e2e/fixtures/data), because public/data is gitignored and normally comes
  # from the API at deploy time.
  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Data snapshot
        run: mkdir -p public/data && cp e2e/fixtures/data/*.json public/data/
      - name: Build
        run: npm run build:site
      - name: Browser
        run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npx playwright test
