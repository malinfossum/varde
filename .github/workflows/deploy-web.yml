name: Deploy Web

on:
  push:
    branches: [main]
  schedule:
    # Daily at 04:00 UTC: data edited directly in Neon reaches the site within a day.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A cron run and a push must never deploy out of order; the newest run wins.
concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx biome ci .
      - run: npm test

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Require SITE_ORIGIN
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
        run: |
          test -n "$SITE_ORIGIN" || { echo "vars.SITE_ORIGIN is not set - refusing to build broken canonical URLs"; exit 1; }
          case "$SITE_ORIGIN" in
            */) echo "vars.SITE_ORIGIN has a trailing slash - drop it, or every canonical URL doubles it up"; exit 1 ;;
          esac

      - name: Build the API
        run: dotnet build api/Varde.Api/Varde.Api.csproj -c Release

      # The API runs only here, against Neon, long enough to export. This log is public:
      # Warning level, no sensitive-data logging, and the export prints counts only.
      - name: Start the API
        env:
          ConnectionStrings__VardeDb: ${{ secrets.NEON_CONNECTION_STRING }}
          ASPNETCORE_ENVIRONMENT: Production
          ASPNETCORE_URLS: http://localhost:5005
          Logging__LogLevel__Default: Warning
        run: |
          dotnet run --project api/Varde.Api/Varde.Api.csproj -c Release --no-build --no-launch-profile > api.log 2>&1 &
          echo $! > api.pid
          for i in $(seq 1 60); do
            curl -sf http://localhost:5005/api/municipalities > /dev/null && exit 0
            sleep 2
          done
          echo "API did not answer within 120 s"
          grep -v -i -E 'host|user|password|connection' api.log | tail -n 20
          exit 1

      - name: Export data
        working-directory: web
        run: |
          npm ci
          npm run data -- http://localhost:5005

      - name: Stop the API
        if: always()
        run: kill "$(cat api.pid)" 2>/dev/null || true

      - name: Build and prerender
        working-directory: web
        env:
          VITE_SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/dist --project-name=varde --branch=main
