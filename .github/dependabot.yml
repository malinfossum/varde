# Ward baseline, from templates/dependabot.yml in malinfossum/ward.
# Majors are never grouped, so each gets its own PR for me to read. Every block
# waits 21 days before it proposes a major, so a broken x.0.0 is fixed by then.
version: 2
updates:
  # GitHub's own actions are grouped and may auto-merge. Ward's two pins arrive
  # together and merge only when both move to a Ward release tag. Every other
  # action gets its own PR for me to read.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 21
    groups:
      actions-first-party:
        patterns:
          - "actions/*"
          - "github/*"
          - "dependabot/*"
        update-types: [minor, patch]
      ward:
        patterns:
          - "malinfossum/ward*"

  - package-ecosystem: npm # package.json
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 21
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm # pipeline/package.json
    directory: /pipeline
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 21
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: nuget # *.csproj
    directory: /api
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 21
    groups:
      dotnet-runtime:
        patterns:
          - "Microsoft.AspNetCore.*"
          - "Microsoft.EntityFrameworkCore*"
          - "Microsoft.Extensions.*"
          - "Microsoft.NET.*"
          - "System.*"
        update-types: [minor, patch]
      nuget-minor-patch:
        patterns: ["*"]
        exclude-patterns:
          - "Microsoft.AspNetCore.*"
          - "Microsoft.EntityFrameworkCore*"
          - "Microsoft.Extensions.*"
          - "Microsoft.NET.*"
          - "System.*"
        update-types: [minor, patch]
    ignore:
      # Microsoft.AspNetCore.OpenApi 10.x only accepts Microsoft.OpenApi 2.x (its source
      # generator breaks on 3.x, see #57). Remove this when the API moves to .NET 11.
      - dependency-name: "Microsoft.OpenApi"
        update-types: ["version-update:semver-major"]
      # .NET majors come with the next runtime, and I move to it on purpose, not
      # one package at a time. Remove these when I move to the next .NET.
      - dependency-name: "Microsoft.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: dotnet-sdk # global.json
    directory: /api
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 21
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
